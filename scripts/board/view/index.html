<!doctype html>
<!-- Task 034: the board, seen. Built by scripts/board/view/build.mjs into logs/board/view/ beside data.js (derive.mjs).
     Opens from file:// with no network: no CDN, no fetch; the data comes in as a script. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board viewer</title>
<style>
:root { color-scheme: light dark; --bg: #fff; --fg: #1d1d1f; --mute: #6b6b70; --line: #d8d8dc; --faint: #ececef; --panel: #f6f6f8;
  --me: #d9480f; --pick: #1c6dd0; --bank: #2b2b2b; --shop: #8d8d92; --res: #b6b6ba; --else: #ececef; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #161618; --fg: #e8e8ea; --mute: #9a9aa0; --line: #3a3a3e; --faint: #26262a; --panel: #1f1f22;
    --me: #ff8a4c; --pick: #6aa8ff; --bank: #e0e0e0; --shop: #8a8a90; --res: #55555a; --else: #2a2a2e; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
header { display: flex; gap: 16px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; }
header nav a { margin-right: 12px; color: var(--fg); text-decoration: none; padding: 2px 4px; border-bottom: 2px solid transparent; }
header nav a.on { border-color: var(--pick); }
header .meta { color: var(--mute); }
main { padding: 12px 16px 40px; }
h2 { font-size: 14px; margin: 18px 0 6px; }
h3 { font-size: 13px; margin: 12px 0 4px; }
.note { color: var(--mute); margin: 2px 0 8px; }
a { color: var(--pick); }
svg { display: block; overflow: visible; }
svg text { fill: var(--fg); font-size: 10px; }
svg .mute { fill: var(--mute); }
svg .axis { stroke: var(--line); }
svg .grid { stroke: var(--faint); }
table { border-collapse: collapse; }
th, td { padding: 2px 6px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--faint); }
th { cursor: pointer; position: sticky; top: 0; background: var(--bg); font-weight: 600; user-select: none; }
td.l, th.l { text-align: left; }
tr.old td { color: var(--mute); }
tr.row:hover td { background: var(--panel); cursor: pointer; }
tr.me td { font-weight: 700; color: var(--me); }
.me { color: var(--me); font-weight: 700; }
.scroll { max-height: 520px; overflow: auto; border: 1px solid var(--line); }
.cols { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
.char { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 10px; }
.char .hd { display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline; }
.char .hd b { font-size: 14px; }
select, input, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 2px 4px; }
input[type=number] { width: 4.5em; }
#tip { position: fixed; pointer-events: none; z-index: 9; max-width: 460px; white-space: pre-line; background: var(--panel); color: var(--fg);
  border: 1px solid var(--line); padding: 5px 7px; font-size: 12px; display: none; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.legend span { display: inline-block; margin-right: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 3px; vertical-align: -1px; }
.bar { fill: var(--pick); }
.bar.q { fill: var(--me); }
[data-go] { cursor: pointer; }
#detail table td { text-align: left; }
</style>
</head>
<body>
<header>
  <h1>The board</h1>
  <nav id="nav"></nav>
  <span class="meta" id="meta"></span>
</header>
<main id="main">Loading…</main>
<div id="tip"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
